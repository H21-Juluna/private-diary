<!DOCTYPE html>
<html lang="zh‑CN">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>双人私密日记</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi5Liq5Lq65paH5Lqs6K6hIiwic2hvcnRfbmFtZSI6Iuiwg+WcsCIsInN0YXJ0X3VybCI6Ii8iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSJ9">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase‑js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box‑sizing: border‑box;
            font‑family: ‑apple‑system,BlinkMacSystemFont,"Segoe UI",Roboto,sans‑serif;
        }
        body {
            background:#fffbf5;
            color:#444;
            max‑width:700px;
            margin:0 auto;
            padding:20px 16px;
            line‑height:1.65;
        }
        .container {
            background:#ffffff;
            border‑radius:22px;
            padding:28px;
            box‑shadow:0 2px 12px rgba(0,0,0,0.06);
        }
        h1 {
            text‑align:center;
            margin‑bottom:24px;
            font‑size:24px;
            font‑weight:500;
            color:#333;
        }
        input,textarea,button,select {
            width:100%;
            padding:12px 14px;
            margin:8px 0;
            border:1px solid #e9e2d8;
            border‑radius:14px;
            font‑size:15px;
            background:#fffdfa;
        }
        button {
            background:#f8e9d2;
            border:none;
            cursor:pointer;
            font‑weight:500;
        }
        button:hover {
            background:#f3ddbc;
        }
        .tag‑daily {background:#fff3bc;color:#7a6220;padding:3px 8px;border‑radius:10px;font‑size:13px;}
        .tag‑happy {background:#ffd6e0;color:#992c4c;padding:3px 8px;border‑radius:10px;font‑size:13px;}
        .tag‑sad {background:#cbe4ff;color:#204b80;padding:3px 8px;border‑radius:10px;font‑size:13px;}
        .tag‑miss {background:#e4d8ff;color:#533691;padding:3px 8px;border‑radius:10px;font‑size:13px;}
        .diary‑item {
            border‑bottom:1px solid #f1ebe3;
            padding:18px 0;
        }
        .hidden {display:none;}
        .btn‑danger {background:#ffdfdf;}
    </style>
</head>
<body>
<div class="container">
    <h1>双人私密日记</h1>

    <div id="login‑view">
        <h3>登录</h3>
        <input type="email" id="login‑email" placeholder="邮箱">
        <input type="password" id="login‑pwd" placeholder="密码">
        <button onclick="doLogin()">登录</button>
    </div>

    <div id="main‑view" class="hidden">
        <div>
            <select id="mood‑select">
                <option value="日常">日常</option>
                <option value="开心">开心</option>
                <option value="伤心">伤心</option>
                <option value="想念">想念</option>
            </select>
            <textarea id="diary‑content" placeholder="写下今天的内容……" rows="5"></textarea>
            <input type="file" id="img‑upload" accept="image/*">
            <button onclick="saveDiary()">保存日记</button>
        </div>

        <div style="margin‑top:24px;">
            <input type="date" id="filter‑date">
            <button onclick="loadDiary()">按日期筛选</button>
            <button onclick="loadDiary()">刷新全部</button>
        </div>

        <div id="diary‑list"></div>
        <button style="margin‑top:20px;background:#eee;" onclick="logout()">退出登录</button>
    </div>
</div>

<script>
// ========== 你的真实配置 ==========
const SUPABASE_URL = "https://mpawlhcontfzdvmepfnc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_umErt65gH34u4_AhbsKKyw_g8shdWge";

const { createClient } = window.supabase;
//❗改名！不再叫supabase，改成 sbClient，规避CDN全局变量冲突
const sbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl:true
    }
});

window.onload = async function(){
    const {data:{session}} = await sbClient.auth.getSession();
    if(session){
        showMain();
    }
};

async function doLogin(){
    const email = document.getElementById("login‑email").value.trim();
    const pwd = document.getElementById("login‑pwd").value;
    const {error} = await sbClient.auth.signInWithPassword({email,password:pwd});
    if(error) alert(error.message);
    else showMain();
}

function showMain(){
    document.getElementById("login‑view").classList.add("hidden");
    document.getElementById("main‑view").classList.remove("hidden");
    loadDiary();
}

async function logout(){
    await sbClient.auth.signOut();
    document.getElementById("main‑view").classList.add("hidden");
    document.getElementById("login‑view").classList.remove("hidden");
}

async function saveDiary(){
    const mood = document.getElementById("mood‑select").value;
    const content = document.getElementById("diary‑content").value.trim();
    if(!content) return alert("内容不能为空");
    const user = (await sbClient.auth.getUser()).data.user;
    const {error} = await sbClient.from("diaries").insert([{
        user_id:user.id,
        mood:mood,
        content:content,
        create_at:new Date().toISOString()
    }]);
    if(error) alert(error.message);
    else {
        document.getElementById("diary‑content").value="";
        loadDiary();
    }
}

async function loadDiary(){
    const filterDate = document.getElementById("filter‑date").value;
    let q = sbClient.from("diaries").select("*").order("create_at",{asc:false});
    if(filterDate){
        const start = filterDate+"T00:00:00Z";
        const end = filterDate+"T23:59:59Z";
        q = q.gte("create_at",start).lte("create_at",end);
    }
    const {data,error} = await q;
    if(error) return alert(error.message);
    const box = document.getElementById("diary‑list");
    box.innerHTML="";
    data.forEach(item=>{
        const div = document.createElement("div");
        let cls;
        if(item.mood==="日常") cls="tag‑daily";
        else if(item.mood==="开心") cls="tag‑happy";
        else if(item.mood==="伤心") cls="tag‑sad";
        else cls="tag‑miss";

        div.className="diary‑item";
        div.innerHTML=`
        <span class="${cls}">${item.mood}</span>
        <div>${new Date(item.create_at).toLocaleString()}</div>
        <div style="margin:8px 0;">${item.content}</div>
        <button class="btn‑danger" onclick="delDiary('${item.id}')">删除日记</button>
        `;
        box.appendChild(div);
    })
}

async function delDiary(id){
    if(!confirm("确定删除这条日记？")) return;
    const {error}=await sbClient.from("diaries").delete().eq("id",id);
    if(error) alert(error.message);
    else loadDiary();
}
</script>
</body>
</html>
